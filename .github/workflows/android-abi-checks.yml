name: Android ABI checks

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-abi-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  build-release-apk:
    name: Release APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build minified release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease -PscoopAbi=${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        with:
          name: Scoop-release-${{ matrix.abi }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
