name: Bug report
description: Report something that isn't working correctly in Scoop.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Scoop version
      description: Settings → About, or the APK filename you downloaded.
      placeholder: "1.2.1"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: "Android 14"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "Pixel 7"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste this link: ...
        2. Choose ...
        3. Tap Download
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Anything from Logcat, a crash message, or a screenshot helps.
    validations:
      required: false
